<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Calendar</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="{{ctx}}/static/css/style.css">
    <link rel="stylesheet" href="{{ctx}}/static/css/calendar.css">
    <script src="{{ctx}}/static/js/calendar.js" defer></script>
</head>

<body>
    <main class="page-content calendar-page">
        <p class="signed-in">Signed in as: {{user}} &mdash; <a href="{{ctx}}/logout">Sign out</a></p>
        <nav aria-label="Application">
            <a href="{{ctx}}/home">Home</a>
            <a href="{{ctx}}/calculator">Calculator</a>
            <a href="{{ctx}}/numberguess">Number Guess</a>
            <a href="{{ctx}}/snake.html">Snake</a>
            <a href="{{ctx}}/calendar" aria-current="page">Calendar</a>
            <a href="{{admin_href}}"{{admin_style}}>Manage Users</a>
        </nav>

        <h1>Calendar</h1>
        <p class="calendar-date">Today: <time datetime="{{today_iso}}">{{today_label}}</time></p>
        {{tabs}}
        {{message}}
        <div class="calendar-actions calendar-primary-actions">
            <a href="{{ctx}}/calendar?edit=new#event-editor">New event</a>
            <a href="{{ctx}}/calendar?export=all">Export calendar</a>
        </div>
        {{content}}
        <p><a href="{{ctx}}/home">Back to Home</a></p>
    </main>
</body>

</html>
