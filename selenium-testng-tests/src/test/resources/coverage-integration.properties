# URL that points to your CTP instance
parasoft.coverage.integration.ctp.url=http://ctp:8080/em/

# The ID of CTP environment where your coverage agents are configured
parasoft.coverage.integration.ctp.envId=3

# Session tag used when publishing test and coverage results
parasoft.coverage.integration.dtp.sessionTag=selenium-testng-session

# Authentication username for CTP
parasoft.coverage.integration.ctp.auth.username=admin

# Password for CTP (replace for your environment)
parasoft.coverage.integration.ctp.auth.password=admin

# Enables support for parallel test execution in coverage integration
parasoft.coverage.integration.parallel.test.enabled=true

# User associated with this coverage session
parasoft.coverage.integration.ctp.userId=jonnytest
